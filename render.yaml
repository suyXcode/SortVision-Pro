services:
  - type: web
    name: sortvision-pro
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 3 --threads 2 --timeout 60 app:app
    envVars:
      - key: APP_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
